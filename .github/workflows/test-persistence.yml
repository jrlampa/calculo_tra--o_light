    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pandas

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_parity" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run parity Excel tests
        run: |
          cd python
          pytest tests/test_parity_excel.py -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-parity
          path: python/.pytest_cache/

  # Testes de Integração Real
  test-integracao-real:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_integracao
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_integracao" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run integração real tests
        run: |
          cd python
          pytest tests/test_integracao_real.py -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-integracao
          path: python/.pytest_cache/

  # Teste de Execução Completa
  test-execucao-completa:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_completo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_completo" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run execução completa tests
        run: |
          cd python
          python executar_testes_persistencia.py

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-completo
          path: |
            python/.pytest_cache/
            python/coverage/

  # Testes de Performance
  test-performance:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_performance
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_performance" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run performance tests
        run: |
          cd python
          pytest tests/test_integracao_real.py::TestIntegracaoReal::test_integracao_real_performance -v --tb=short

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: python/.pytest_cache/

  # Testes de Concorrência
  test-concorrencia:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_concorrencia
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_concorrencia" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run concorrência tests
        run: |
          cd python
          pytest tests/test_integracao_real.py::TestIntegracaoReal::test_integracao_real_concorrencia -v --tb=short

      - name: Upload concorrência results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: concorrencia-results
          path: python/.pytest_cache/

  # Testes de Segurança de Dados
  test-seguranca-dados:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_seguranca
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_seguranca" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run segurança de dados tests
        run: |
          cd python
          pytest tests/test_hierarquia_completa.py::TestHierarquiaCompleta::test_hierarquia_completa_consistencia_referencial -v --tb=short
          pytest tests/test_integracao_real.py::TestIntegracaoReal::test_integracao_real_multiplos_usuarios -v --tb=short

      - name: Upload segurança results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: seguranca-results
          path: python/.pytest_cache/

  # Resumo dos Testes de Persistência
  resumo-testes:
    runs-on: ubuntu-latest
    needs: [
      test-hierarquia-completa,
      test-persistencia-calculo,
      test-parity-excel,
      test-integracao-real,
      test-execucao-completa,
      test-performance,
      test-concorrencia,
      test-seguranca-dados
    ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate persistence test summary
        run: |
          echo "## 📊 Resumo dos Testes de Persistência" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Teste | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Hierarquia Completa | ${{ needs.test-hierarquia-completa.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Persistência de Cálculo | ${{ needs.test-persistencia-calculo.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Parity Excel | ${{ needs.test-parity-excel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integração Real | ${{ needs.test-integracao-real.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Execução Completa | ${{ needs.test-execucao-completa.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.test-performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Concorrência | ${{ needs.test-concorrencia.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Segurança de Dados | ${{ needs.test-seguranca-dados.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Contar testes bem-sucedidos
          SUCCESS_COUNT=$(echo "${{ needs.test-hierarquia-completa.result }} ${{ needs.test-persistencia-calculo.result }} ${{ needs.test-parity-excel.result }} ${{ needs.test-integracao-real.result }} ${{ needs.test-execucao-completa.result }} ${{ needs.test-performance.result }} ${{ needs.test-concorrencia.result }} ${{ needs.test-seguranca-dados.result }}" | grep -o "success" | wc -l)
          
          echo "### Resultado: $SUCCESS_COUNT/8 testes bem-sucedidos" >> $GITHUB_STEP_SUMMARY
          
          if [ "$SUCCESS_COUNT" -eq 8 ]; then
            echo "✅ **Todos os testes de persistência passaram!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Alguns testes de persistência falharam. Verifique os logs.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on persistence test failure
        if: needs.test-hierarquia-completa.result == 'failure' || needs.test-persistencia-calculo.result == 'failure' || needs.test-parity-excel.result == 'failure' || needs.test-integracao-real.result == 'failure'
        run: |
          echo "❌ Testes de persistência falharam. Verifique os logs detalhados."
          exit 1