name: Testes de Persistência

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'python/tests/test_*.py'
      - 'python/executar_testes_persistencia.py'
      - 'python/repositories/**/*.py'
      - 'python/services/**/*.py'
      - 'python/models/**/*.py'
      - 'python/api/**/*.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'python/tests/test_*.py'
      - 'python/executar_testes_persistencia.py'
      - 'python/repositories/**/*.py'
      - 'python/services/**/*.py'
      - 'python/models/**/*.py'
      - 'python/api/**/*.py'
  schedule:
    # Executar testes de persistência diariamente às 2h da manhã
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Testes de Hierarquia Completa
  test-hierarquia-completa:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_hierarquia
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-persistence-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-persistence-

      - name: Install Python dependencies
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_hierarquia" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run hierarquia completa tests
        run: |
          cd python
          pytest tests/test_hierarquia_completa.py -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-hierarquia
          path: python/.pytest_cache/

  # Testes de Persistência de Cálculos
  test-persistencia-calculo:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_calculo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_calculo" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run persistência de cálculo tests
        run: |
          cd python
          pytest tests/test_persistencia_calculo.py -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-calculo
          path: python/.pytest_cache/

  # Testes de Parity Excel
  test-parity-excel:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_parity
        options: >-
