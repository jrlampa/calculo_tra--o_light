name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Job 1: Testes Python (Backend)
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist
          pip install coverage[toml]

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV

      - name: Run Python tests
        run: |
          cd python
          # Executar script de testes de persistência
          python executar_testes_persistencia.py
          
          # Executar testes individuais com cobertura
          pytest tests/ \
            --cov=api \
            --cov=services \
            --cov=repositories \
            --cov=db \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./python/coverage.xml
          flags: backend
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-python
          path: |
            python/coverage/
            python/.pytest_cache/

  # Job 2: Testes Frontend
  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-frontend
          path: |
            coverage/
            test-results/

  # Job 3: Testes E2E
  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-e2e
          path: |
            test-results/
            playwright-report/

  # Job 4: Testes de Integração Completa
  test-integration:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up integration environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/integration_test_db" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "API_URL=http://localhost:8000" >> $GITHUB_ENV

      - name: Run API server
        run: |
          cd python
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run integration tests
        run: |
          cd python
          pytest tests/test_integration.py -v

  # Job 5: Segurança e Qualidade
  security-quality:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          cd python
          bandit -r . -f json -o bandit-report.json
          bandit -r .

      - name: Run Safety dependency check
        run: |
          cd python
          safety check --json --output safety-report.json
          safety check

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            python/bandit-report.json
            python/safety-report.json

  # Job 6: Deploy Staging (apenas para develop)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend, test-e2e, test-integration, security-quality]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.calculo-tracao-light.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploy to staging environment"
          # Aqui seria a integração com Docker, Kubernetes, etc.

  # Job 7: Deploy Production (apenas para main)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend, test-e2e, test-integration, security-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://calculo-tracao-light.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploy to production environment"
          # Aqui seria a integração com Docker, Kubernetes, etc.

  # Job 8: Notificações
  notify:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend, test-e2e, test-integration, security-quality]
    if: always()

    steps:
      - name: Notify on success
        if: needs.test-python.result == 'success' && needs.test-frontend.result == 'success'
        run: |
          echo "✅ All tests passed successfully!"

      - name: Notify on failure
        if: needs.test-python.result == 'failure' || needs.test-frontend.result == 'failure'
        run: |
          echo "❌ Some tests failed. Check the logs for details."
          exit 1