name: CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements.txt
        pip install pytest requests python-dotenv
        
    - name: Run Unit Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/python
        python -m pytest python/tests/test_qdt_parity.py
        
    - name: Run Fuzzy Tests (Mocked API check)
      run: |
        # Em CI real, subiríamos o servidor em background. 
        # Aqui apenas verificamos se os scripts de teste estão íntegros.
        python -m pytest python/tests/test_fuzzy_inputs.py --collect-only
