name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Executar security scanning semanalmente às 4h da manhã
    - cron: '0 4 * * 0'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Job 1: Python Security Scanning
  python-security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Install security tools
        run: |
          pip install bandit safety semgrep pip-audit

      - name: Run pip-audit for Python dependencies
        run: |
          pip-audit --desc --output pip-audit-report.json
          pip-audit --desc
        continue-on-error: true

      - name: Run Bandit security scan
        run: |
          bandit -r python/ -f json -o bandit-report.json
          bandit -r python/

      - name: Run Safety dependency check
        run: |
          safety check --json --output safety-report.json
          safety check
        continue-on-error: true

      - name: Run Semgrep security scan
        run: |
          semgrep --config=auto --json --output=semgrep-report.json .
          semgrep --config=auto .

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
            semgrep-report.json

      - name: Upload Bandit scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: bandit-report.json

  # Job 2: Node.js Security Scanning
  node-security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint code quality check
        run: |
          npx eslint src e2e --format json --output-file eslint-report.json || true
          npx eslint src e2e || true

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json
          npm audit

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ secrets.SNYK_TOKEN != '' }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: node-security-reports
          path: |
            npm-audit-report.json
            eslint-report.json

  # Job 3: Docker Security Scanning
  docker-security:
    runs-on: ubuntu-latest
    needs: [python-security, node-security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          tags: ghcr.io/${{ github.repository }}/backend:security-scan
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          tags: ghcr.io/${{ github.repository }}/frontend:security-scan
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/backend:security-scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/frontend:security-scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      - name: Upload Trivy scan results (frontend)
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'

      - name: Upload Docker security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: docker-security-reports
          path: |
            trivy-backend-results.sarif
            trivy-frontend-results.sarif

  # Job 4: Secrets Scanning
  secrets-scanning:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Job 5: License Compliance
  license-compliance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install license checker
        run: |
          pip install pip-licenses

      - name: Generate Python license report
        run: |
          pip-licenses --format=json --output-file=python-licenses.json
          pip-licenses --format=csv --output-file=python-licenses.csv

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install license checker
        run: |
          npm install -g license-checker

      - name: Generate Node.js license report
        run: |
          license-checker --json --out node-licenses.json
          license-checker --csv --out node-licenses.csv

      - name: Upload license reports
        uses: actions/upload-artifact@v3
        with:
          name: license-reports
          path: |
            python-licenses.json
            python-licenses.csv
            node-licenses.json
            node-licenses.csv

  # Job 6: Security Summary
  security-summary:
    runs-on: ubuntu-latest
    needs: [python-security, node-security, docker-security, secrets-scanning, license-compliance]
    if: always()
    
    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Security | ${{ needs.python-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Security | ${{ needs.node-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Security | ${{ needs.docker-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scanning | ${{ needs.secrets-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if any security scans failed
          if [[ "${{ needs.python-security.result }}" == "failure" || "${{ needs.node-security.result }}" == "failure" || "${{ needs.docker-security.result }}" == "failure" ]]; then
            echo "❌ **Security issues detected!** Please review the security reports." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **No critical security issues detected.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on security issues
        if: needs.python-security.result == 'failure' || needs.node-security.result == 'failure' || needs.docker-security.result == 'failure'
        run: |
          echo "🚨 Security issues detected! Please review the security reports."
          exit 1