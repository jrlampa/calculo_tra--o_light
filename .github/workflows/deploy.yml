name: Deploy Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Job 1: Build Docker Images
  build-images:
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.backend-image.outputs.image }}
      frontend-image: ${{ steps.frontend-image.outputs.image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/backend
            ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: frontend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.calculo-tracao-light.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment"
          # Aqui seria a integração com Docker Compose, Kubernetes, etc.
          
          # Exemplo com Docker Compose:
          # docker-compose -f docker-compose.staging.yml down
          # docker-compose -f docker-compose.staging.yml up -d
          
          # Exemplo com Kubernetes:
          # kubectl apply -f k8s/staging/
          # kubectl set image deployment/backend backend=${{ needs.build-images.outputs.backend-image }}
          # kubectl set image deployment/frontend frontend=${{ needs.build-images.outputs.frontend-image }}

      - name: Health check
        run: |
          echo "Running health checks for staging"
          # curl -f https://staging.calculo-tracao-light.com/health || exit 1

      - name: Run smoke tests
        run: |
          echo "Running smoke tests for staging"
          # npm run test:smoke:staging

  # Job 3: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images, deploy-staging]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://calculo-tracao-light.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment"
          # Aqui seria a integração com Docker Compose, Kubernetes, etc.

      - name: Health check
        run: |
          echo "Running health checks for production"
          # curl -f https://calculo-tracao-light.com/health || exit 1

      - name: Run smoke tests
        run: |
          echo "Running smoke tests for production"
          # npm run test:smoke:production

  # Job 4: Database Migrations
  migrate-database:
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install alembic

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/migration_test" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          cd python
          alembic upgrade head

      - name: Run migration tests
        run: |
          cd python
          pytest tests/test_migration.py -v

  # Job 5: Performance Testing
  performance-testing:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run performance tests
        run: |
          echo "Running performance tests"
          # npm run test:performance:staging

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results/

  # Job 6: Security Scanning
  security-scanning:
    runs-on: ubuntu-latest
    needs: [build-images]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ needs.build-images.outputs.backend-image }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: '${{ needs.build-images.outputs.backend-image }}'
          args: --severity-threshold=high

  # Job 7: Cleanup
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy-production, performance-testing, security-scanning]
    if: always()
    
    steps:
      - name: Cleanup old Docker images
        run: |
          echo "Cleaning up old Docker images"
          # docker image prune -f

      - name: Cleanup old artifacts
        run: |
          echo "Cleaning up old artifacts"
          # rm -rf artifacts/

  # Job 8: Notifications
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production, performance-testing, security-scanning, cleanup]
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "✅ Deploy to production successful!"
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"Deploy to production successful!"}' ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify on failure
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Deploy to production failed!"
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"Deploy to production failed!"}' ${{ secrets.SLACK_WEBHOOK }}
          exit 1