[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculo-tracao-light"
version = "0.1.0"
description = "Electrical calculation system for traction poles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
)/
'''

[tool.flake8]
max-line-length = 100
exclude = [
  ".git",
  "__pycache__",
  "venv",
  ".venv",
  "node_modules",
  ".eggs",
  "*.egg"
]
ignore = [
  "E203",
  "W503",
  "E501"
]
per-file-ignores = [
  "__init__.py:F401"
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["python/tests", "e2e"]
python_files = ["test_*.py", "*_test.py", "*.spec.js"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
  -v
  --strict-markers
  --tb=short
  --cov=python
  --cov-report=term-missing
  --cov-report=html
  --cov-fail-under=70
"""
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "persistence: marks tests as persistence tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__init__.py",
  "*/virtualenvs/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "if 0:",
  "if False:",
]

[tool.autopep8]
max_line_length = 100
aggressive = 2
in-place = true
recursive = true

[tool.pylint]
[tool.pylint.messages_control]
disable = [
  "C0330",
  "C0326",
]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = [
  "tests",
  "venv",
  ".venv"
]
