---
# Ansible playbook for deploying calculo_tração_light
# This playbook handles the complete deployment process

- name: Deploy calculo_tração_light application
  hosts: app_servers
  become: yes
  vars:
    project_name: "calculo-tração-light"
    environment: "{{ deploy_environment | default('production') }}"
    app_user: "app"
    app_group: "app"
    app_home: "/opt/{{ project_name }}"
    app_port: 8000
    frontend_port: 3000
    
    # Application versions
    python_version: "3.11"
    node_version: "18"
    
    # Database configuration
    db_host: "{{ database_host }}"
    db_name: "{{ database_name }}"
    db_user: "{{ database_user }}"
    db_password: "{{ database_password }}"
    
    # Redis configuration
    redis_host: "{{ redis_host }}"
    redis_port: 6379
    
    # Application configuration
    secret_key: "{{ application_secret_key }}"
    jwt_secret: "{{ jwt_secret_key }}"
    
    # Monitoring configuration
    monitoring_enabled: true
    log_level: "INFO"
    
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - nginx
          - supervisor
          - git
          - curl
          - wget
          - build-essential
          - libpq-dev
          - redis-server
        state: present
    
    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        shell: /bin/bash
        create_home: yes
        home: "{{ app_home }}"
    
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ app_home }}"
        - "{{ app_home }}/logs"
        - "{{ app_home }}/config"
        - "{{ app_home }}/venv"
        - "{{ app_home }}/frontend"
        - "{{ app_home }}/backend"
    
    - name: Install Docker
      include_tasks: docker_setup.yml
    
    - name: Install Node.js
      include_tasks: nodejs_setup.yml

  tasks:
    - name: Clone or update application repository
      git:
        repo: "{{ application_repository }}"
        dest: "{{ app_home }}/backend"
        version: "{{ deploy_version | default('main') }}"
        update: yes
        force: yes
      notify: Restart application
    
    - name: Setup Python virtual environment
      pip:
        name:
          - virtualenv
          - pip-tools
        virtualenv: "{{ app_home }}/venv"
        virtualenv_python: python3
    
    - name: Install Python dependencies
      pip:
        requirements: "{{ app_home }}/backend/requirements.txt"
        virtualenv: "{{ app_home }}/venv"
        extra_args: "--upgrade"
    
    - name: Setup frontend
      include_tasks: frontend_setup.yml
    
    - name: Configure application environment
      template:
        src: templates/.env.j2
        dest: "{{ app_home }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'
      notify: Restart application
    
    - name: Configure database
      include_tasks: database_setup.yml
    
    - name: Setup Nginx configuration
      template:
        src: templates/nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ project_name }}"
        owner: root
        group: root
        mode: '0644'
    
    - name: Enable Nginx site
      file:
        src: "/etc/nginx/sites-available/{{ project_name }}"
        dest: "/etc/nginx/sites-enabled/{{ project_name }}"
        state: link
      notify: Restart Nginx
    
    - name: Setup Supervisor configuration
      template:
        src: templates/supervisor.conf.j2
        dest: "/etc/supervisor/conf.d/{{ project_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: Restart Supervisor
    
    - name: Setup monitoring
      include_tasks: monitoring_setup.yml
      when: monitoring_enabled
    
    - name: Run database migrations
      command: "{{ app_home }}/venv/bin/python manage.py migrate"
      args:
        chdir: "{{ app_home }}/backend"
      become_user: "{{ app_user }}"
      notify: Restart application
    
    - name: Collect static files
      command: "{{ app_home }}/venv/bin/python manage.py collectstatic --noinput"
      args:
        chdir: "{{ app_home }}/backend"
      become_user: "{{ app_user }}"
      notify: Restart application
    
    - name: Setup log rotation
      template:
        src: templates/logrotate.conf.j2
        dest: "/etc/logrotate.d/{{ project_name }}"
        owner: root
        group: root
        mode: '0644'
    
    - name: Configure firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 22    # SSH
        - 80    # HTTP
        - 443   # HTTPS
    
    - name: Enable and start services
      service:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - nginx
        - supervisor
        - redis-server

  handlers:
    - name: Restart application
      supervisorctl:
        name: "{{ project_name }}"
        state: restarted
    
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
    
    - name: Restart Supervisor
      service:
        name: supervisor
        state: restarted

- name: Health check
  hosts: app_servers
  gather_facts: no
  tasks:
    - name: Wait for application to be ready
      wait_for:
        host: localhost
        port: "{{ app_port }}"
        timeout: 60
        delay: 10
    
    - name: Check application health
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200
    
    - name: Display deployment status
      debug:
        msg: "Application deployed successfully on {{ inventory_hostname }}"